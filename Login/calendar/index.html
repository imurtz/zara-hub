<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>التقاويم الميلادية | بوابة زارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Alexandria:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--fg:#25322e;--muted:#667570;--line:#dcd7cd;--accent:#517670;--accent-fg:#ffffff;--soft:#e7eeeb;--warn:#a87a22;--ok:#2d7a55;--bad:#b3402f;--stage:#e6e1d8;--focus:#b8926d}
body{background:var(--bg);color:var(--fg);padding-inline:16px;font-family:'Readex Pro','Cairo',system-ui,sans-serif;font-size:15px;line-height:1.6}
#app{max-width:1280px;margin-inline:auto;padding-block:18px 48px;--fd:'Alexandria';--fb:'Readex Pro'}
#app[data-font="2"]{--fd:'Readex Pro';--fb:'Readex Pro'}
#app[data-font="3"]{--fd:'Cairo';--fb:'Cairo'}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand h1{font-size:1.45rem;letter-spacing:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:92px;line-height:1.3}
.tab b{font-weight:600;font-size:.95rem}.tab span{font-size:.72rem;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab[aria-pressed="true"] span{color:inherit;opacity:.85}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:22px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
.preview{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:10px}
@media (max-width:920px){.preview{position:static}}
.stage{direction:ltr;position:relative;width:100%;overflow:hidden;border-radius:12px;background:var(--stage);box-shadow:0 1px 0 var(--line)}
.pagebox{position:absolute;left:0;top:0;width:210mm;height:150mm;transform-origin:0 0;direction:rtl;overflow:hidden;background:#fff}
.page{position:relative;width:210mm;height:150mm;overflow:hidden;background:#fff}
.navrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--soft);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:480px){.months{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 2px;cursor:pointer;font-size:.82rem;position:relative}
.mbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mbtn i{position:absolute;top:3px;inset-inline-start:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box h2{font-size:1.05rem}
.box h3{font-size:.86rem;color:var(--muted);font-weight:500;margin-top:4px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
.field input[type=text],.field input[type=url]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.field input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.img{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{width:64px;height:48px;border-radius:6px;background:var(--soft) center/cover;border:1px solid var(--line);flex:none}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.savebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.pill{font-size:.76rem;border-radius:20px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}
#status{font-size:.82rem;color:var(--muted);min-height:1.3em}
#status.bad{color:var(--bad)}
details.box>summary{cursor:pointer;font-weight:600}
.fontsel{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.fontsel select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px}
.evnote{font-size:.78rem;color:var(--muted);margin:0}
.sections{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sections button{border:0;background:none;padding:10px 18px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.sections button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#app[data-sec="approved"] .only-design{display:none!important}
#app:not([data-sec="approved"]) .only-approved{display:none!important}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.chk li{display:flex;gap:8px;align-items:flex-start}.chk b{flex:none;width:1.2em}.chk .w{color:var(--warn)}.chk .g{color:var(--ok)}
/* ---- واجهة التحرير بأسلوب بوابة زارة (لا تمسّ تصاميم صفحات التقويم A–D) ---- */
:root{--bg:#F5F6F5;--panel:#ffffff;--fg:#141C1B;--muted:#6B7674;--line:rgba(20,28,27,.10);--accent:#4B7071;--accent-fg:#ffffff;--soft:#E6EEED;--warn:#8F6A45;--ok:#324C4B;--bad:#B4483C;--stage:#ECEFEE;--focus:#B88D66;color-scheme:light}
html,body{margin:0}
body{background:transparent;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14.5px;padding-inline:4px}
#app{padding-block:4px 40px;max-width:1320px}
header.top{align-items:center;margin-bottom:14px}
.brand h1{font-size:1.25rem;font-weight:600}
.brand p{font-size:.82rem}
body.embedded .brand,body.embedded #sections{display:none}
body.embedded header.top{justify-content:flex-start}
.tab{border-radius:18px;padding:8px 16px;border-color:var(--line)}
.tab[aria-pressed="true"]{background:linear-gradient(140deg,#58807F,#324C4B);border-color:transparent}
.btn{border-radius:999px;padding:8px 18px;font-weight:500;border-color:var(--line);transition:border-color .15s}
.btn.primary{background:linear-gradient(140deg,#58807F,#324C4B);border-color:transparent}
.seg{border-radius:999px;border-color:var(--line)}
.seg button{padding:7px 18px}
.mbtn{border-radius:14px;padding:7px 2px;border-color:var(--line)}
.box{border-radius:24px;padding:20px 22px;border-color:rgba(20,28,27,.08)}
.box h2{font-size:1.02rem;font-weight:600}
.field input[type=text],.field input[type=url]{border-radius:14px;padding:9px 12px;background:#F1F3F2;border-color:transparent}
.field input[type=text]:focus,.field input[type=url]:focus{background:#fff;border-color:var(--accent);outline:none}
.fontsel select{border-radius:999px;padding:7px 12px;border-color:var(--line)}
.stage{border-radius:24px;box-shadow:none;border:1px solid rgba(20,28,27,.08)}
.thumb{border-radius:12px}
.pill{border-radius:999px;padding:3px 12px}
.sections{border-bottom-color:var(--line)}
.calbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{max-width:520px;margin:60px auto;background:#fff;border:1px solid rgba(20,28,27,.08);border-radius:24px;padding:28px;text-align:center;color:var(--muted)}
.notice b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:6px}
/* ---- طباعة كل الصفحات: 24 صفحة بمقاس 210×150 مم ---- */
#printall{display:none}
@media print{
  @page{size:210mm 150mm;margin:0}
  html,body{background:#fff!important;padding:0!important}
  #app{max-width:none;padding:0;margin:0}
  #app>*:not(#printall){display:none!important}
  #printall{display:block!important;position:static!important;left:auto!important;top:auto!important;width:auto!important;direction:rtl}
  #printall .page{direction:rtl;border-radius:0}
  #printall .page{page-break-after:always;break-after:page}
  #printall .page:last-child{page-break-after:auto;break-after:auto}
}
.tabs[hidden]{display:none}
/* ---- حامل الصفحة (يُكبَّر/يُصغَّر مع المعاينة) وعناصر الموك أب ---- */
.rig{position:absolute;left:0;top:0;width:210mm;height:150mm;transform-origin:0 0}
.mk-over{display:none}
/* ---- موك أب التقويم المكتبي: صورة حقيقية + الصفحة مُسقطة على سطحها + حلقات السلك تُعاد فوق الصفحة ---- */
#app[data-sec="mockup"] .only-design{display:none!important}
#app[data-sec="mockup"] .layout{grid-template-columns:minmax(0,1fr);max-width:1040px;margin-inline:auto}
#app[data-sec="mockup"] .preview{position:static}
/* المشهد: صورة الموك أب الأصلية بخلفيتها البيضاء ← الصفحة المنحنية ← حلقات السلك (مقصوصة من الصورة بشفافية، فتبقى فضية فوق أي لون) */
.stage.mock{border:1px solid rgba(20,28,27,.08);background:#3a2a1c url(mockup/bg2.jpg) center/cover no-repeat}
.stage.mock .rig{visibility:hidden}
.mk-shade,.mk-body{display:none}
.stage.mock .mk-shade{display:block;position:absolute;inset:0;z-index:1;background:url(mockup/body.webp) center/100% 100% no-repeat;pointer-events:none}
.stage.mock .mk-body{display:none;position:absolute;inset:0;z-index:2;background:url(mockup/desk.jpg) center/100% 100% no-repeat;pointer-events:none;clip-path:polygon(22.95% 18.3%,77.7% 23.8%,81.45% 77.3%,71.55% 84.25%,16.25% 71.9%,16.35% 70.7%)}
#mockcells{position:absolute;inset:0;z-index:3;pointer-events:none}
.mcell{position:absolute;left:0;top:0;width:210mm;height:150mm;transform-origin:0 0;direction:rtl;overflow:hidden;background:#fff}
.stage.mock .mk-over{display:block;position:absolute;inset:0;z-index:4;pointer-events:none;background:url(mockup/rings.png) center/100% 100% no-repeat}

/* ---- the four designs (generated from the print templates) ---- */
.page *{box-sizing:border-box;margin:0;padding:0}
.page{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-a.page{position:relative;width:210mm;height:150mm;overflow:hidden;background:#fff;page-break-after:always}
.d-a.page>*{position:absolute}
.d-a .band{left:0;bottom:0}
.d-a .logo{right:12mm;top:7mm;width:40mm;mix-blend-mode:multiply}
.d-a .qrbox{background:#fff;border-radius:2.4mm;padding:1.4mm;border:.3mm solid var(--cb);display:inline-block;line-height:0}
.d-a .ph{font-size:2.6mm;color:var(--cb);font-weight:500}
.d-a .sp{display:flex;align-items:center;gap:3mm;height:12mm;width:76mm}
.d-a .sp.left{left:12mm;top:6.5mm}
.d-a .sp em{font-style:normal;font-size:2.5mm;color:var(--cb);font-weight:600;order:-1;white-space:nowrap}
.d-a .sp>:not(em){flex:1;height:100%;display:flex;align-items:center;justify-content:center;border:.25mm dashed var(--cb);border-radius:2mm}
.d-a .sp img{max-height:100%;max-width:100%;object-fit:contain;border:0}
.d-a .arch{left:12mm;top:22mm;width:76mm;height:82mm;border-radius:38mm 38mm 3mm 3mm;overflow:hidden}
.d-a .arch.o{left:9.2mm;top:19.4mm;border:.35mm solid var(--cb);background:none;overflow:visible}
.d-a .arch img{width:100%;height:100%;object-fit:cover}
.d-a .phimg{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#dfe6e2 0 3mm,#d3dcd7 3mm 6mm);gap:1mm}
.d-a .phimg b{font-family:var(--fd);font-size:9mm;color:var(--cg);opacity:.55}
.d-a .phimg span{font-size:2.6mm;color:var(--cg);opacity:.6;direction:ltr}
.d-a .credit{left:12mm;width:76mm;top:105.6mm;text-align:center;font-size:2.5mm;color:var(--cb);font-weight:500}
.d-a .dock{left:12mm;top:111.5mm;width:76mm;display:flex;justify-content:space-between}
.d-a .qr{width:22mm;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.7mm}
.d-a .qr .qrbox{margin-bottom:.8mm}
.d-a .qr b{font-size:2.55mm;font-weight:700;line-height:1.25;white-space:nowrap}
.d-a .qr span{font-size:2.3mm;color:var(--cb);font-weight:500;line-height:1.25;white-space:nowrap}
.d-a .year{left:100mm;top:8mm;direction:ltr;display:flex;flex-wrap:wrap;align-items:baseline;gap:1.2mm;width:42mm}
.d-a .year b{font-size:12.5mm;font-weight:700;color:var(--cb);line-height:1;letter-spacing:.3mm}
.d-a .year span{font-size:4mm;font-weight:700;color:var(--cb)}
.d-a .year small{width:100%;font-size:3mm;color:var(--cg);font-weight:600;direction:rtl;text-align:left}
.d-a h1{right:12mm;top:25mm;font-family:var(--fd);font-weight:700;font-size:17mm;line-height:1;color:var(--cg)}
.d-a .hpill{right:12mm;top:46mm;background:#e6e7e8;color:var(--cb);font-weight:700;font-size:3.3mm;padding:1.1mm 4mm;border-radius:5mm}
.d-a .grid{left:100mm;right:12mm;top:56mm;width:98mm;border-collapse:collapse;table-layout:fixed;direction:rtl}
.d-a .grid th{height:6mm;font-size:2.8mm;font-weight:700;color:var(--cg);border-bottom:.45mm solid var(--cg);vertical-align:middle}
.d-a .grid th.fri{color:var(--cb)}
.d-a .grid td{height:var(--rh);text-align:center;vertical-align:middle;border-bottom:.2mm solid #e6e7e8;padding:0}
.d-a .ghost{left:100mm;top:25mm;direction:ltr;font-family:var(--fb);font-weight:700;font-size:33mm;line-height:1;letter-spacing:-.5mm;color:transparent;-webkit-text-stroke:.28mm var(--cb);opacity:.75}
.d-a .grid td.fri,.d-a .grid th.fri{background:color-mix(in srgb,var(--cb) 13%,transparent)}
.d-a .grid td i{display:block;font-style:normal;font-size:5.4mm;font-weight:700;line-height:6.3mm;margin:0 auto;width:6.3mm;height:6.3mm;border-radius:50%}
.d-a .grid td i.ev{color:#fff;font-size:4.5mm;width:6.4mm;height:6.4mm;line-height:6.4mm}
.d-a .grid td s{display:block;text-decoration:none;font-size:2.35mm;color:var(--cb);font-weight:600;line-height:2.6mm}
.d-a .legend{left:100mm;right:12mm;top:121.6mm;display:flex;flex-wrap:wrap;gap:.8mm 3.4mm;font-size:2.35mm;font-weight:500;line-height:3.4mm}
.d-a .legend span{white-space:nowrap}
.d-a .legend u{display:inline-block;width:1.9mm;height:1.9mm;border-radius:50%;margin-left:1.1mm;vertical-align:-.15mm}
.d-a .slogan{right:12mm;top:132.4mm;display:flex;flex-direction:column;font-family:var(--fb)}
.d-a .slogan b{font-size:4.1mm;font-weight:700;color:var(--cg);line-height:1.35}
.d-a .slogan span{font-size:3.6mm;font-weight:500;color:var(--cb);line-height:1.35}
.d-a h2{right:12mm;top:27mm;font-family:var(--fd);line-height:1.12;display:flex;flex-direction:column}
.d-a h2 b{font-size:13.5mm;font-weight:700;color:var(--cg)}
.d-a h2 span{font-size:13.5mm;font-weight:700;color:var(--cb)}
.d-a .form{right:12mm;top:62mm;width:98mm;background:#f1f2f2;border-radius:3mm;padding:3mm 4mm;display:flex;flex-direction:column;gap:1.7mm}
.d-a .ft{font-size:2.8mm;color:#6b6b6b;font-weight:500;display:flex;align-items:center;gap:1.5mm;margin-bottom:.5mm}
.d-a .ft i{width:3.2mm;height:3.2mm;border:.3mm solid #8a8a8a;border-radius:.8mm}
.d-a .f{display:flex;align-items:center;gap:3mm}
.d-a .f label{width:26mm;font-size:2.7mm;color:#555;font-weight:500;white-space:nowrap}
.d-a .f sup{color:#c0392b;font-size:2.4mm}
.d-a .f p{flex:1;height:4.2mm;border:.25mm solid #b9b9b9;border-radius:2.1mm;background:#fff}
.d-a .f p.sel{height:auto;min-height:4.2mm;padding:.8mm 3mm;display:flex;gap:3mm;font-size:2.3mm;color:#777;border-radius:2mm;flex-wrap:wrap}
.d-a .bigqr{left:21mm;top:27mm;width:58mm;display:flex;flex-direction:column;align-items:center;gap:2.2mm}
.d-a .bigqr .qrbox{padding:2.2mm;border-radius:4mm}
.d-a .cname{background:var(--cg);color:#fff;font-family:var(--fb);font-weight:700;font-size:4.4mm;padding:1.4mm 6mm;border-radius:5mm;white-space:nowrap}
.d-a .go{font-family:var(--fb);font-weight:700;font-size:4mm;color:var(--cb)}
.d-a .spt{left:0;right:0;top:111mm;text-align:center;font-size:2.5mm;color:var(--cb);font-weight:600;letter-spacing:.3mm}
.d-a .sponsors{left:12mm;right:12mm;top:115.5mm;display:grid;grid-template-columns:repeat(6,1fr);gap:2mm 2.4mm}
.d-a .s{height:10mm;border:.25mm dashed var(--cb);border-radius:2mm;display:flex;align-items:center;justify-content:center}
.d-a .s img{max-height:8mm;max-width:90%;object-fit:contain}
.d-a .handle{left:12mm;top:138.4mm;font-size:2.6mm;color:var(--cb);font-weight:600;letter-spacing:.4mm;direction:ltr}
.d-a.page{color:var(--cg);font-family:var(--fb),sans-serif}
.d-a .logo{right:auto;left:12mm}
.d-a.month .logo{width:34mm;top:6mm}
.d-a .sp.left{left:auto;right:12mm;width:52mm}
.d-b.page{position:relative;width:210mm;height:150mm;overflow:hidden;background:#fbf8f2;page-break-after:always}
.d-b.page>*{position:absolute}
.d-b .qrbox{background:#fff;border-radius:2.2mm;padding:1.4mm;display:inline-block;line-height:0}
.d-b .tabR{right:0;top:0;width:54mm;height:19mm;background:#fff;border-radius:0 0 0 7mm;display:flex;align-items:center;justify-content:center}
.d-b .tabR img{width:40mm;mix-blend-mode:multiply}
.d-b .ph{font-size:2.6mm;color:var(--cb);font-weight:500}
.d-b .photo{left:0;top:0;width:210mm;height:60mm}
.d-b .photo img,.d-b .phimg{width:100%;height:100%;object-fit:cover}
.d-b .phimg{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#9fb3ad 0 4mm,#92a8a1 4mm 8mm)}
.d-b .phimg span{color:#fff;opacity:.7;font-size:3mm;direction:ltr}
.d-b .shade{left:0;top:0;width:210mm;height:60mm;background:linear-gradient(to top,rgba(30,48,44,.92) 0%,rgba(30,48,44,.5) 42%,rgba(30,48,44,0) 78%)}
.d-b .tabL{left:0;top:0;width:62mm;height:15mm;background:#fff;border-radius:0 0 7mm 0;display:flex;align-items:center;gap:2.4mm;padding:0 5mm 0 4mm;direction:rtl}
.d-b .tabL em{font-style:normal;font-size:2.4mm;color:var(--cb);font-weight:600;white-space:nowrap}
.d-b .sb{flex:1;height:10mm;display:flex;align-items:center;justify-content:center;border:.25mm dashed var(--cb);border-radius:2mm}
.d-b .sb img{max-height:100%;max-width:100%;object-fit:contain}
.d-b .title{right:12mm;top:28mm;color:#fff;font-family:var(--fd);font-weight:700;font-size:20mm;line-height:1}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }

      var maxDcCount = 0;
      var maxEcCount = 0;

      var ecdata = new Array(rsBlocks.length);

        for (var i = 0; i < ecdata[r].length; i += 1) {

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var index = 0;

            index += 1;
          }
        }
      }

        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

function qrSvg(url,mm){const q=qrcode(0,"H");q.addData(url||"https://example.com");q.make();const n=q.getModuleCount();
 const zone=(r,c)=>(r<8&&c<8)||(r<8&&c>=n-8)||(r>=n-8&&c<8);let dots="";
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c)&&!zone(r,c))dots+=`<circle cx="${c+.5}" cy="${r+.5}" r=".47"/>`;
 let eyes="";[[0,0],[0,n-7],[n-7,0]].forEach(([r0,c0])=>{eyes+=`<rect x="${c0}" y="${r0}" width="7" height="7" rx="1.2"/><rect x="${c0+1}" y="${r0+1}" width="5" height="5" rx=".6" fill="#fff"/><rect x="${c0+2}" y="${r0+2}" width="3" height="3" rx=".5"/>`});
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" width="${mm}mm" height="${mm}mm" style="fill:var(--cg)">${dots}${eyes}</svg>`}

/* ---------- الموك أب: إسقاط الصفحة على سطح التقويم كما في ملف الـPSD تماماً ----------
   السطح ليس مستوياً: الكائن الذكي في الملف يمرّ بشبكة انحناء 4×4 (Bezier) ثم بمنظور. القيم أدناه منقولة من الملف:
   MK.PX/PY نقاط الشبكة مطبَّعة (0..1)، MK.Q أركان المنظور نسبةً لأبعاد الصورة، MK.U0/V0 إزاحة التصميم داخل اللوحة
   (لوحة الكائن الذكي تتجاوز الورقة يساراً بنحو 3%، وغلاف 2026 موضوع فيها بهذه الإزاحة — تُحقِّق من ذلك بمطابقته).
   الصفحة تُقسَّم خلايا، ولكل خلية نسخة من الصفحة بمصفوفة منظور خاصة، فتتبع الانحناء. */
const MK={PX:[[0,.3118,.6427,1],[-.0266,.272,.5939,.9942],[-.0318,.2534,.5994,.9969],[0,.2957,.6441,1]],
 PY:[[0,-.0012,-.0062,0],[.3376,.3389,.3251,.3278],[.6717,.6731,.6544,.641],[1,1.0017,1.0068,1]],
 Q:[[.21171,.18163],[.77191,.24343],[.70593,.83317],[.1497,.70797]],U0:.03,V0:.006,NU:4,NV:7};
const mkB=t=>[(1-t)**3,3*t*(1-t)**2,3*t*t*(1-t),t**3];
function mkFwd(up,vp,w,h){const u=MK.U0+(1-MK.U0)*up,v=MK.V0+(1-MK.V0)*vp,bu=mkB(u),bv=mkB(v);let sx=0,sy=0;
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){const k=bv[r]*bu[c];sx+=k*MK.PX[r][c];sy+=k*MK.PY[r][c]}
 const q=MK.Q,x0=q[0][0]*w,y0=q[0][1]*h,x1=q[1][0]*w,y1=q[1][1]*h,x2=q[2][0]*w,y2=q[2][1]*h,x3=q[3][0]*w,y3=q[3][1]*h;
 const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1,g=(dx3*dy2-dx2*dy3)/den,k=(dx1*dy3-dx3*dy1)/den;
 const d=g*sx+k*sy+1;return[((x1-x0+g*x1)*sx+(x3-x0+k*x3)*sy+x0)/d,((y1-y0+g*y1)*sx+(y3-y0+k*y3)*sy+y0)/d]}
/* مصفوفة منظور تنقل أربع نقاط مصدر إلى أربع نقاط هدف (حل 8 معادلات) */
function mkH(src,dst){const A=[],B=[];for(let i=0;i<4;i++){const [x,y]=src[i],[X,Y]=dst[i];A.push([x,y,1,0,0,0,-X*x,-X*y]);B.push(X);A.push([0,0,0,x,y,1,-Y*x,-Y*y]);B.push(Y)}
 for(let c=0;c<8;c++){let m=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;[A[c],A[m]]=[A[m],A[c]];[B[c],B[m]]=[B[m],B[c]];
  for(let r=c+1;r<8;r++){const f=A[r][c]/A[c][c];for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];B[r]-=f*B[c]}}

 let P=null;try{P=window.parent&&window.parent!==window&&window.parent.__zaraCal}catch(_){}
 if(!P||!P.db){$("#app").innerHTML='<div class="notice"><b>التقاويم الميلادية</b>تُفتح هذه الصفحة من لوحة موظفي بوابة زارة ← تبويب «التقاويم الميلادية».</div>';return}
 BRIDGE=P;document.body.classList.add("embedded");
 CANW=!!P.canEdit;CANEDIT=!!P.canApprove;
 const fs=P.db,base=fs.collection("calendars").doc(String(YEAR));
 // cal/<id> ← calendars/<السنة>/pages/<id> ،  approved/y<السنة> ← calendarsApproved/<السنة>
 const ref=path=>{const p=path.split("/");return p[0]==="approved"?fs.collection("calendarsApproved").doc(String(YEAR)):base.collection("pages").doc(p[1])};
 DB={doc:path=>({set:d=>Promise.resolve().then(()=>ref(path).set(P.plain(JSON.stringify(d)))).catch(e=>{console.error("calendar save",e);throw{code:e&&e.code}}),onSnapshot:(a,b)=>ref(path).onSnapshot(a,b)}),
     collection:()=>({onSnapshot:(a,b)=>base.collection("pages").onSnapshot(a,b)})};
 if(P.canEdit&&P.upload)ASSETS={upload:b=>P.upload(b).then(url=>({id:url}))};
 DL={save:o=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([o.data],{type:"application/json"}));a.download=o.filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return Promise.resolve()}};
 window.__calSetSection=s=>{if(s!=="approved"&&s!=="design"&&s!=="mockup")return;if(s==="design"&&!P.canEdit)s="approved";SEC=s;renderSec()};
 {const qs=new URLSearchParams(location.search).get("sec");SEC=qs==="mockup"?"mockup":(qs==="design"&&P.canEdit)?"design":"approved"}
 try{DB.collection("cal").onSnapshot(applySnap,()=>{})}catch(_){}
 try{DB.doc("approved/y"+YEAR).onSnapshot(sn=>{APPROVED=sn.exists?sn.data():null;renderApprove();renderApBox();if(SEC==="approved"){syncNav();drawPreview()}},()=>{})}catch(_){}
 renderAll()})();
})();
</script>
