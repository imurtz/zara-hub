<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>عدّاد التسجيل | بوابة زارة</title>
<link rel="icon" href="/assets/favicon.png?v=4" sizes="any">
<link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* عدّاد التسجيل المباشر — صفحة مفتوحة لأصحاب العلاقة: الرقم كبيراً، ثم التقدّم نحو الهدف، ثم التفاصيل.
   لا تعرض أي بيانات شخصية؛ أرقام وتوزيعات فقط. */
:root{
  --bg:#F5F6F5; --card:#FFFFFF; --line:#E4E9E8; --ink:#141C1B; --soft:#6B7775;
  --teal:#4B7071; --teal-d:#324C4B; --teal-t:#E6EEED; --tan:#B88D66; --tan-t:#F6EEE5; --ok:#2F6F5E;
  --num:"Readex Pro","IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(60% 40% at 85% 0%,rgba(75,112,113,.10),transparent 70%),radial-gradient(50% 35% at 0% 10%,rgba(184,141,102,.10),transparent 70%)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header .brand{display:flex;align-items:center;gap:12px}
header img{height:40px;width:auto;display:block}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--teal-d);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.live i{width:9px;height:9px;border-radius:50%;background:#2F9E6E;box-shadow:0 0 0 0 rgba(47,158,110,.6);animation:pulse 2s infinite}
.live.off i{background:#C9A25B;animation:none}
.live.err i{background:#B3453F;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,110,.55)}70%{box-shadow:0 0 0 9px rgba(47,158,110,0)}100%{box-shadow:0 0 0 0 rgba(47,158,110,0)}}
.tools{display:flex;gap:8px}
.tools button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--teal-d);border-radius:999px;padding:7px 14px;cursor:pointer}
.tools button:hover{border-color:var(--teal)}
.card{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(20,28,27,.06);border-radius:26px;box-shadow:0 18px 40px -30px rgba(20,28,27,.45)}

/* البطاقة الرئيسية: اسم الفعالية والعدد */
.hero{padding:28px 28px 24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.hero .kicker{display:inline-block;font-size:12.5px;font-weight:700;color:#8A6440;background:var(--tan-t);padding:4px 12px;border-radius:999px}
.hero h1{margin:10px 0 4px;font-size:clamp(22px,3.2vw,30px);line-height:1.35}
.hero .sub{margin:0;color:var(--soft);font-size:14px}
.count{text-align:center}
.count .n{font-family:var(--num);font-weight:700;font-size:clamp(76px,14vw,150px);line-height:1;color:var(--teal-d);letter-spacing:-2px;font-variant-numeric:tabular-nums;transition:color .4s}
.count .n.bump{animation:bump .9s ease}
@keyframes bump{0%{transform:scale(1)}25%{transform:scale(1.06);color:var(--tan)}100%{transform:scale(1)}}
.count .l{margin-top:6px;font-size:15px;font-weight:600;color:var(--soft)}
.goal{grid-column:1/-1}
.goal .bar{height:14px;border-radius:999px;background:var(--teal-t);overflow:hidden}
.goal .bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--teal-d));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.goal .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;color:var(--soft)}
.goal .meta b{color:var(--teal-d);font-family:var(--num)}

/* مؤشرات صغيرة */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px 18px}
.stat .v{font-family:var(--num);font-weight:700;font-size:28px;color:var(--teal-d);line-height:1.2}
.stat .v small{font-size:14px;font-weight:600;color:var(--soft);font-family:"IBM Plex Sans Arabic",sans-serif}
.stat .k{font-size:13px;color:var(--soft);margin-top:4px}
.stat.up .v{color:var(--ok)}

/* التفاصيل */
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.panel{padding:20px 22px}
.panel h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.panel h3 span{font-size:12px;font-weight:500;color:var(--soft)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .lbl{font-size:10px;fill:var(--soft);font-family:var(--num)}
.chart .val{font-size:10.5px;fill:var(--teal-d);font-weight:700;font-family:var(--num)}
.bk{display:flex;flex-direction:column;gap:18px}
.bk-group b{display:block;font-size:13px;margin-bottom:8px;color:var(--teal-d)}
.row{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) 64px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.row .t{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{height:10px;border-radius:999px;background:var(--teal-t);overflow:hidden}
.row .b span{display:block;height:100%;border-radius:999px;background:var(--teal);transition:width 1s ease}
.row:nth-child(3n+2) .b span{background:var(--tan)}
.row .c{font-family:var(--num);font-weight:600;color:var(--teal-d);text-align:left;font-size:12.5px}
.row .c em{font-style:normal;color:var(--soft);font-weight:500}
footer{text-align:center;color:var(--soft);font-size:12px;padding-top:6px}
.closed-badge{display:none;margin-top:12px;font-weight:700;color:var(--ok);background:#E4F1EC;border-radius:999px;padding:6px 14px;font-size:13.5px}
body.closed .closed-badge{display:inline-block}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--teal-d);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* وضع شاشة العرض: الرقم يملأ الشاشة */
body.screen{padding:0;background:var(--teal-d);color:#fff}
body.screen .wrap{max-width:none;min-height:100vh;justify-content:center;padding:4vh 5vw}
body.screen header img{filter:brightness(0) invert(1)}
body.screen .live,body.screen .tools button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
body.screen .card{background:transparent;border:0;box-shadow:none;backdrop-filter:none}
body.screen .hero{grid-template-columns:1fr;text-align:center}
body.screen .hero h1{font-size:4vw}
body.screen .hero .sub,body.screen .count .l,body.screen .goal .meta{color:rgba(255,255,255,.75)}
body.screen .count .n{font-size:24vw;color:#fff}
body.screen .goal .bar{background:rgba(255,255,255,.15);height:18px}
body.screen .goal .bar span{background:var(--tan)}
body.screen .goal .meta b{color:#fff}
body.screen .stats,body.screen .grid2,body.screen footer{display:none}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:22px 18px 20px;gap:16px}
  .count{order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  header img{height:34px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="/assets/logo.png" alt="خيرية العوامية"></div>
    <div class="tools">
      <span class="live" id="live"><i></i><span id="liveTxt">مباشر</span></span>
      <button type="button" id="shareBtn" title="مشاركة الرقم الحالي">مشاركة</button>
      <button type="button" id="screenBtn" title="وضع شاشة العرض">شاشة العرض</button>
    </div>
  </header>

  <section class="card hero">
    <div>
      <span class="kicker" id="kicker">عدّاد التسجيل</span>
      <h1 id="title">—</h1>
      <p class="sub" id="sub"></p>
      <span class="closed-badge">✔ اكتمل التسجيل — هذا هو العدد النهائي</span>
    </div>
    <div class="count">
      <div class="n" id="total">0</div>
      <div class="l">مسجّل حتى الآن</div>
    </div>
    <div class="goal" id="goal" hidden>
      <div class="bar"><span id="goalBar"></span></div>
      <div class="meta"><span>الهدف: <b id="goalN">0</b></span><span><b id="goalPct">0%</b> من الهدف</span></div>
    </div>
  </section>

  <section class="stats">
    <div class="card stat up"><div class="v" id="today">0</div><div class="k">سجّلوا اليوم</div></div>
    <div class="card stat"><div class="v" id="last">—</div><div class="k">آخر تسجيل</div></div>
    <div class="card stat"><div class="v" id="avg">0</div><div class="k">متوسط التسجيل اليومي</div></div>
    <div class="card stat"><div class="v" id="left">—</div><div class="k" id="leftK">متبقٍ على الهدف</div></div>
  </section>

  <section class="grid2">
    <div class="card panel chart"><h3>التسجيل يوماً بيوم <span id="chartNote"></span></h3><div id="chart"></div></div>
    <div class="card panel"><h3>التوزيع <span>نسبة من الإجمالي</span></h3><div class="bk" id="bk"></div></div>
  </section>

  <footer><span id="updated">—</span> · يتحدّث تلقائياً كل <span id="every">15</span> ثانية · بوابة زارة</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const P=new URLSearchParams(location.search);
  const EVERY=15;
  const fmt=n=>Number(n||0).toLocaleString("en-US");
  const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

  /* مصدر البيانات — الشكل المتوقع من سكربت جدول الردود (يُربط لاحقاً):
     { title, subtitle, target, closed, total, today, lastAt (ms), series:[{d:"2026-10-20",n:12},…],
       breakdowns:[{label:"الجنس",items:[{k:"ذكر",n:40},…]},…], updatedAt (ms) }
     حتى الربط: ?demo=1 يعرض بيانات توضيحية تتغيّر كأن تسجيلات تصل */
  let demo=null;
  function demoData(){
    if(!demo){
      const start=new Date();start.setHours(0,0,0,0);
      const series=[];let tot=0;const base=[6,9,14,11,18,15,22,19,27,24,31,26,35,12];
      for(let i=13;i>=0;i--){const d=new Date(start);d.setDate(d.getDate()-i);const n=base[13-i];tot+=n;series.push({d:d.toISOString().slice(0,10),n});}
      demo={title:"ورشة مفاتيح التوظيف 2",subtitle:"الثلاثاء والأربعاء · 10 – 11 نوفمبر 2026 · قاعة الملك عبدالله",target:350,closed:false,series,total:tot,lastAt:Date.now()-4*60000,
        breakdowns:[{label:"الجنس",items:[{k:"ذكر",n:0},{k:"أنثى",n:0}]},{label:"المؤهل",items:[{k:"بكالوريوس",n:0},{k:"ثانوي",n:0},{k:"دبلوم",n:0},{k:"ماجستير",n:0}]},{label:"المدينة",items:[{k:"العوامية",n:0},{k:"القطيف",n:0},{k:"صفوى",n:0},{k:"سيهات",n:0},{k:"أخرى",n:0}]}]};
      const W=[[.46,.54],[.52,.21,.19,.08],[.48,.22,.12,.1,.08]];
      demo.breakdowns.forEach((g,i)=>{let s=0;g.items.forEach((it,j)=>{it.n=Math.round(demo.total*W[i][j]);s+=it.n;});g.items[0].n+=demo.total-s;});
    }
    if(Math.random()<.55){const add=1+Math.floor(Math.random()*3);demo.total+=add;demo.series[demo.series.length-1].n+=add;demo.lastAt=Date.now();
      demo.breakdowns.forEach(g=>{for(let a=0;a<add;a++){g.items[Math.floor(Math.random()*g.items.length*.7)].n++;}});}
    return Promise.resolve(Object.assign({},demo,{today:demo.series[demo.series.length-1].n,updatedAt:Date.now()}));
  }
  function fetchData(){
    if(P.get("demo")) return demoData();
    // سيُربط هنا رابط سكربت جدول الردود الخاص بالفعالية (حسب رمز الرابط ?k=)
    return Promise.reject(new Error("not_linked"));
  }

  let shown=0,lastData=null;
  function animateTo(el,to){
    const from=shown,t0=performance.now(),dur=Math.min(1600,400+Math.abs(to-from)*30);
    if(to>from&&from>0){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(step);else shown=to;};
    requestAnimationFrame(step);
  }
  const ago=ms=>{if(!ms)return"—";const m=Math.max(0,Math.round((Date.now()-ms)/60000));if(m<1)return"الآن";if(m<60)return m+" <small>د</small>";const h=Math.round(m/60);if(h<24)return h+" <small>س</small>";return Math.round(h/24)+" <small>يوم</small>";};
  function chart(series){
    const W=560,H=200,pad=22,n=series.length,max=Math.max(1,...series.map(s=>s.n)),bw=(W-pad*2)/n;
    let g="";series.forEach((s,i)=>{const h=Math.round((H-pad*2-14)*s.n/max),x=pad+i*bw+bw*.18,y=H-pad-h,w=bw*.64,isT=i===n-1;
      g+=`<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${Math.max(2,h)}" rx="${Math.min(6,w/2).toFixed(1)}" fill="${isT?"#B88D66":"#4B7071"}" opacity="${isT?1:.85}"/>`;
      if(s.n)g+=`<text class="val" x="${(x+w/2).toFixed(1)}" y="${y-5}" text-anchor="middle">${s.n}</text>`;
      if(i%2===n%2||isT){const d=new Date(s.d+"T00:00:00");g+=`<text class="lbl" x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${isT?"اليوم":d.getDate()+"/"+(d.getMonth()+1)}</text>`;}});
    $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="عدد المسجلين يومياً"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#E4E9E8"/>${g}</svg>`;
    $("chartNote").textContent="آخر "+n+" يوماً";
  }
  function breakdowns(list,total){
    $("bk").innerHTML=(list||[]).map(g=>{const sum=g.items.reduce((a,b)=>a+b.n,0)||1;
      return `<div class="bk-group"><b>${g.label}</b>`+g.items.slice().sort((a,b)=>b.n-a.n).map(it=>{const p=Math.round(it.n*100/sum);
        return `<div class="row"><span class="t">${it.k}</span><span class="b"><span style="width:${p}%"></span></span><span class="c">${fmt(it.n)} <em>${p}%</em></span></div>`;}).join("")+`</div>`;}).join("");
  }
  function render(d){
    document.title=fmt(d.total)+" مسجّل — "+d.title;
    $("title").textContent=d.title;$("sub").textContent=d.subtitle||"";
    document.body.classList.toggle("closed",!!d.closed);
    if(d.total!==shown)animateTo($("total"),d.total);
    $("today").textContent=fmt(d.today);
    $("last").innerHTML=ago(d.lastAt);
    const days=(d.series||[]).filter(s=>s.n>0).length||1;$("avg").textContent=fmt(Math.round(d.total/days));
    if(d.target){$("goal").hidden=false;const pct=Math.min(100,Math.round(d.total*100/d.target));$("goalBar").style.width=pct+"%";$("goalN").textContent=fmt(d.target);$("goalPct").textContent=pct+"%";
      const left=Math.max(0,d.target-d.total);$("left").textContent=left?fmt(left):"✔";$("leftK").textContent=left?"متبقٍ على الهدف":"تحقّق الهدف";}
    else{$("goal").hidden=true;$("left").textContent="—";}
    if(d.series&&d.series.length)chart(d.series);
    breakdowns(d.breakdowns,d.total);
    const u=new Date(d.updatedAt||Date.now());$("updated").textContent="آخر تحديث "+u.toLocaleTimeString("ar-SA-u-nu-latn",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    // محطة جديدة (كل 50) تُعرض كتنبيه صغير
    if(lastData&&Math.floor(d.total/50)>Math.floor(lastData.total/50))toast("🎉 وصلنا "+fmt(Math.floor(d.total/50)*50)+" مسجّل");
    lastData=d;
  }
  function setLive(state,txt){const l=$("live");l.className="live"+(state==="ok"?"":" "+state);$("liveTxt").textContent=txt;}
  let tt=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3200);}
  function tick(){
    fetchData().then(d=>{render(d);setLive(d.closed?"off":"ok",d.closed?"مغلق":"مباشر");})
      .catch(e=>{setLive("err",e&&e.message==="not_linked"?"غير مربوط بعد":"تعذّر التحديث");if(!lastData){$("title").textContent="لم يُربط هذا العدّاد بنموذج بعد";}});
  }
  $("every").textContent=EVERY;
  tick();setInterval(()=>{if(!document.hidden)tick();},EVERY*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});
  setInterval(()=>{if(lastData)$("last").innerHTML=ago(lastData.lastAt);},30000);

  $("screenBtn").onclick=()=>{const on=!document.body.classList.contains("screen");document.body.classList.toggle("screen",on);$("screenBtn").textContent=on?"خروج":"شاشة العرض";
    try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)document.exitFullscreen();}catch(e){}};
  document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("screen")){document.body.classList.remove("screen");$("screenBtn").textContent="شاشة العرض";}});
  $("shareBtn").onclick=()=>{if(!lastData)return;
    const txt=`📊 ${lastData.title}\nعدد المسجلين حتى الآن: ${fmt(lastData.total)}`+(lastData.target?` من ${fmt(lastData.target)} (${Math.min(100,Math.round(lastData.total*100/lastData.target))}%)`:"")+`\nسجّلوا اليوم: ${fmt(lastData.today)}\n\nالعدّاد المباشر: ${location.href}`;
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast("تم نسخ الرسالة — الصقها في واتساب"));}};
})();
</script>
</body>
</html>
