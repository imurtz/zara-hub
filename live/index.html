<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>عدّاد التسجيل | بوابة زارة</title>
<link rel="icon" href="/assets/favicon.png?v=4" sizes="any">
<link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* عدّاد التسجيل المباشر — فعالية واحدة بثلاثة نماذج Google (المشاركون، المتطوعون، المدربون).
   كل نموذج له لوحة تفاصيل كاملة، وكلها في صفحة واحدة. أرقام وتوزيعات فقط، بلا أي بيانات شخصية. */
:root{
  --bg:#F5F6F5; --card:#FFFFFF; --line:#E4E9E8; --ink:#141C1B; --soft:#6B7775;
  --teal:#4B7071; --teal-d:#324C4B; --tan:#B88D66; --tan-d:#8A6440; --tan-t:#F6EEE5; --ok:#2F6F5E;
  --num:"Readex Pro","IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background-image:radial-gradient(60% 40% at 85% 0%,rgba(75,112,113,.10),transparent 70%),radial-gradient(50% 35% at 0% 10%,rgba(184,141,102,.10),transparent 70%)}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header img{height:38px;width:auto;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--teal-d);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.live i{width:9px;height:9px;border-radius:50%;background:#2F9E6E;animation:pulse 2s infinite}
.live.off i{background:#C9A25B;animation:none}
.live.err i{background:#B3453F;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,110,.55)}70%{box-shadow:0 0 0 9px rgba(47,158,110,0)}100%{box-shadow:0 0 0 0 rgba(47,158,110,0)}}
.tools button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--teal-d);border-radius:999px;padding:7px 14px;cursor:pointer}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(20,28,27,.06);border-radius:24px;box-shadow:0 18px 40px -30px rgba(20,28,27,.45)}

/* رأس الفعالية + الإجمالي */
.event{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.event .kicker{display:inline-block;font-size:12.5px;font-weight:700;color:var(--tan-d);background:var(--tan-t);padding:4px 12px;border-radius:999px}
.event h1{margin:8px 0 2px;font-size:clamp(20px,3vw,28px);line-height:1.35}
.event .sub{margin:0;color:var(--soft);font-size:13.5px}
.event .grand{text-align:center;min-width:140px}
.event .grand .v{font-family:var(--num);font-weight:700;font-size:38px;line-height:1.1;color:var(--teal-d)}
.event .grand .k{font-size:12px;color:var(--soft)}
.closed-badge{display:none;margin-top:10px;font-weight:700;color:var(--ok);background:#E4F1EC;border-radius:999px;padding:5px 13px;font-size:13px}
body.closed .closed-badge{display:inline-block}

/* شريط تنقّل ثابت بين اللوحات الثلاث (مفيد على الجوال) */
.jump{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px;border-radius:18px;background:rgba(245,246,245,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(20,28,27,.06)}
.jump a{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);background:#fff;border-radius:13px;padding:9px 10px;font-size:13px;font-weight:600;min-width:0}
.jump a b{font-family:var(--num);color:var(--c);font-size:16px}
.jump a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* لوحة كل عدّاد */
.trk{padding:20px 22px 22px;border-top:4px solid var(--c)}
.trk-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.trk-head .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);flex:none}
.trk-head .ico svg{width:20px;height:20px}
.trk-head h2{margin:0;font-size:17px;flex:1}
.badge{font-size:12px;font-weight:700;color:var(--ok);background:#E4F1EC;border-radius:999px;padding:4px 10px;white-space:nowrap}
.badge.zero{color:var(--soft);background:#F1F3F2}
.badge.wait{color:#8A6440;background:var(--tan-t)}
.trk-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.big .n{font-family:var(--num);font-weight:700;font-size:clamp(58px,9vw,92px);line-height:.95;color:var(--c);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big .n.bump{animation:bump .9s ease}
@keyframes bump{0%{transform:scale(1)}25%{transform:scale(1.07)}100%{transform:scale(1)}}
.big .l{font-size:13px;color:var(--soft);margin-top:4px}
.big .pct{text-align:left}
.big .pct b{display:block;font-family:var(--num);font-size:26px;color:var(--ink);line-height:1.1}
.big .pct span{font-size:12.5px;color:var(--soft)}
.bar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--c) 13%,#fff);overflow:hidden;margin:12px 0 6px}
.bar span{display:block;height:100%;width:0;border-radius:999px;background:var(--c);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.goalmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft)}
.goalmeta b{font-family:var(--num);color:var(--ink)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.mini{background:#F7F8F7;border-radius:14px;padding:10px 12px}
.mini .v{font-family:var(--num);font-weight:700;font-size:19px;color:var(--teal-d);line-height:1.3}
.mini .v small{font-size:11.5px;font-weight:600;color:var(--soft);font-family:"IBM Plex Sans Arabic",sans-serif}
.mini .k{font-size:11.5px;color:var(--soft)}
.sec-t{font-size:13px;font-weight:700;color:var(--teal-d);margin:0 0 8px;display:flex;justify-content:space-between}
.sec-t span{font-weight:500;color:var(--soft);font-size:11.5px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .lbl{font-size:10px;fill:var(--soft);font-family:var(--num)}
.chart .val{font-size:10.5px;font-weight:700;font-family:var(--num)}
.bk{display:flex;flex-direction:column;gap:16px}
.bk-group b{display:block;font-size:13px;margin-bottom:6px;color:var(--teal-d)}
.row{display:grid;grid-template-columns:minmax(64px,118px) minmax(0,1fr) 64px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{height:9px;border-radius:999px;background:#EEF1F0;overflow:hidden}
.row .b span{display:block;height:100%;border-radius:999px;background:var(--c);transition:width 1s ease}
.row:nth-child(odd) .b span{opacity:.7}
.row .c{font-family:var(--num);font-weight:600;color:var(--teal-d);text-align:left;font-size:12.5px}
.row .c em{font-style:normal;color:var(--soft);font-weight:500}
.empty{color:var(--soft);font-size:13px;text-align:center;padding:18px 0;background:#F7F8F7;border-radius:14px}
.demo-bar{background:#FBEEE0;color:#8A4F1A;border:1px solid #F0D3B4;border-radius:14px;padding:10px 14px;font-size:13.5px;text-align:center}
.demo-bar a{color:#4B7071;font-weight:700}
footer{text-align:center;color:var(--soft);font-size:12px;padding-top:4px}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--teal-d);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}

/* وضع شاشة العرض: الأرقام الثلاثة فقط، كبيرة */
body.screen{padding:0;background:var(--teal-d);color:#fff}
body.screen .wrap{max-width:none;min-height:100vh;justify-content:center;gap:3vh;padding:4vh 4vw}
body.screen header img{filter:brightness(0) invert(1)}
body.screen .live,body.screen .tools button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
body.screen .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);box-shadow:none;backdrop-filter:none}
body.screen .event{justify-content:center;text-align:center}
body.screen .event h1{font-size:3.2vw}
body.screen .event .sub,body.screen .event .grand .k,body.screen .big .l,body.screen .goalmeta,body.screen .big .pct span{color:rgba(255,255,255,.75)}
body.screen .event .grand .v,body.screen .goalmeta b,body.screen .big .pct b,body.screen .trk-head h2{color:#fff}
body.screen .jump,body.screen .minis,body.screen .trk-side,body.screen .sec-t,body.screen .chart,body.screen footer,body.screen .badge{display:none}
body.screen .boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw}
body.screen .trk-body{grid-template-columns:1fr}
body.screen .big{flex-direction:column;align-items:center;text-align:center}
body.screen .big .n{font-size:10vw;color:#fff}
body.screen .big .pct{text-align:center}
body.screen .bar{background:rgba(255,255,255,.14)}
body.screen .bar span{background:var(--tan)}
.boards{display:flex;flex-direction:column;gap:14px}

@media (max-width:860px){
  .trk-body{grid-template-columns:1fr;gap:14px}
  .trk{padding:16px 16px 18px;border-radius:20px}
  .event{padding:16px 18px}
  .event .grand{min-width:0;text-align:right}
  header img{height:32px}
  .jump a{flex-direction:column;gap:0;padding:7px 6px;font-size:11.5px}
  .jump a b{font-size:17px}
  .row{grid-template-columns:minmax(60px,100px) minmax(0,1fr) 60px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/assets/logo.png" alt="خيرية العوامية">
    <div class="tools">
      <span class="live" id="live"><i></i><span id="liveTxt">مباشر</span></span>
      <button type="button" id="shareBtn">مشاركة</button>
      <button type="button" id="screenBtn">شاشة العرض</button>
    </div>
  </header>

  <section class="card event">
    <div>
      <span class="kicker">عدّاد التسجيل المباشر</span>
      <h1 id="title">—</h1>
      <p class="sub" id="sub"></p>
      <span class="closed-badge">✔ اكتمل التسجيل — هذه هي الأعداد النهائية</span>
    </div>
    <div class="grand"><div class="v" id="grand">0</div><div class="k">إجمالي المسجلين في النماذج الثلاثة</div></div>
  </section>

  <nav class="jump" id="jump"></nav>
  <div class="boards" id="boards"></div>

  <footer><span id="updated">—</span> · يتحدّث تلقائياً كل 15 ثانية · بوابة زارة</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const P=new URLSearchParams(location.search);
  const EVERY=15;
  const fmt=n=>Number(n||0).toLocaleString("en-US");

  /* ===== إعداد الفعاليات =====
     لكل عدّاد: رابط سكربت جدول ردود نموذجه (Apps Script ← نشر ← تطبيق ويب). الرابط الفارغ = «لم يُربط بعد».
     الرابط يعيد أرقاماً مجمّعة فقط (العدد، اليومي، التوزيعات) ولا يعيد أي اسم أو رقم جوال. */
  const EVENTS={
    "mafatih2":{
      title:"ورشة مفاتيح التوظيف 2",
      subtitle:"الثلاثاء والأربعاء · 10 – 11 نوفمبر 2026 · قاعة الملك عبدالله",
      closed:false,
      trackers:[
        {key:"participants",label:"المشاركون في الورشة",target:400,url:"https://script.google.com/macros/s/AKfycbyLZZZnt-RmwHn0JYkrV9j5m-4Mcb3rIFNx6XKvzq8elGC8UfDmk1rATsQya2g0WPm23Q/exec"},
        {key:"volunteers",label:"المتطوعون المشاركون",target:100,url:"https://script.google.com/macros/s/AKfycbz1g5hzz5uuhtMFPJIyE3PQ_z1FblLhbB9ZgtXVj1AZwlm-ynPcyc_MAAht1hj5FvQc/exec"},
        {key:"trainers",label:"المدربون",target:35,url:""}
      ]
    }
  };
  const EV=EVENTS[P.get("e")||"mafatih2"]||EVENTS.mafatih2;

  const ICON={
    participants:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.5 14.6c2.6.2 4.6 2 5.2 5.4"/></svg>',
    volunteers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    trainers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 9h6M7 12h4"/></svg>'
  };
  const COLOR={participants:"#4B7071",volunteers:"#B88D66",trainers:"#5B6E8C"};

  /* ===== بيانات توضيحية (?demo=1) — تتغيّر كأن تسجيلات تصل ===== */
  let demo=null;
  function mkSeries(base){const s=new Date();s.setHours(0,0,0,0);return base.map((n,i)=>{const d=new Date(s);d.setDate(d.getDate()-(base.length-1-i));return{d:d.toISOString().slice(0,10),n};});}
  function split(total,ks,ws){let s=0;const it=ks.map((k,i)=>{const n=Math.round(total*ws[i]);s+=n;return{k,n};});it[0].n+=total-s;return it;}
  const DEMO={
    participants:{base:[6,9,14,11,18,15,22,19,27,24,31,26,35,12],bk:[["الجنس",["ذكر","أنثى"],[.44,.56]],["المؤهل",["بكالوريوس","ثانوي","دبلوم","ماجستير"],[.52,.21,.19,.08]],["المدينة",["العوامية","القطيف","صفوى","سيهات","أخرى"],[.48,.22,.12,.1,.08]]],p:.5},
    volunteers:{base:[1,2,4,3,5,4,6,5,7,6,8,6,9,3],bk:[["الجنس",["ذكر","أنثى"],[.5,.5]],["مجال التطوع",["التنظيم والاستقبال","الإعلام والتصوير","الضيافة","الدعم الفني"],[.4,.25,.2,.15]]],p:.2},
    trainers:{base:[0,1,1,0,2,1,1,2,1,2,2,1,3,1],bk:[["التخصص",["كتابة السيرة الذاتية","المقابلات الوظيفية","المهارات الرقمية","ريادة الأعمال"],[.3,.3,.25,.15]]],p:.06}};
  function demoOne(t){
    if(!demo)demo={};
    if(!demo[t.key]){const c=DEMO[t.key],series=mkSeries(c.base),total=c.base.reduce((a,b)=>a+b,0);
      demo[t.key]={series,total,lastAt:Date.now()-(5+Math.random()*90)*60000,breakdowns:c.bk.map(([label,ks,ws])=>({label,items:split(total,ks,ws)}))};}
    const d=demo[t.key];if(Math.random()<DEMO[t.key].p){d.total++;d.series[d.series.length-1].n++;d.lastAt=Date.now();d.breakdowns.forEach(g=>g.items[Math.floor(Math.random()*g.items.length)].n++);}
    return Promise.resolve(JSON.parse(JSON.stringify(Object.assign({},d,{today:d.series[d.series.length-1].n}))));
  }
  function fetchOne(t){
    if(P.get("demo"))return demoOne(t);
    if(!t.url)return Promise.resolve({unlinked:true});
    return fetch(t.url,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("http_"+r.status);return r.json();});
  }

  const shown={};let last=null;
  const ago=ms=>{if(!ms)return"—";const m=Math.max(0,Math.round((Date.now()-ms)/60000));if(m<1)return"الآن";if(m<60)return m+" <small>دقيقة</small>";const h=Math.round(m/60);if(h<24)return h+" <small>ساعة</small>";return Math.round(h/24)+" <small>يوم</small>";};
  function animate(el,key,to){
    const from=shown[key]||0;if(from===to){el.textContent=fmt(to);return;}
    if(to>from&&from>0){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
    const t0=performance.now(),dur=Math.min(1600,400+Math.abs(to-from)*30);
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);shown[key]=to;
  }
  function trimSeries(s){if(!s)return s;let i=s.findIndex(x=>x.n>0);if(i<0)return s.slice(-7);return s.slice(Math.max(0,Math.min(i,s.length-7)));}
  function chartSVG(series,color){
    series=trimSeries(series);
    const W=560,H=170,pad=18,n=series.length,max=Math.max(1,...series.map(s=>s.n)),bw=(W-pad*2)/n;let g="";
    series.forEach((s,i)=>{const h=Math.round((H-pad*2-14)*s.n/max),x=pad+i*bw+bw*.18,y=H-pad-h,w=bw*.64,isT=i===n-1;
      g+=`<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${Math.max(2,h)}" rx="${Math.min(6,w/2).toFixed(1)}" fill="${color}" opacity="${isT?1:.5}"/>`;
      if(s.n)g+=`<text class="val" fill="${color}" x="${(x+w/2).toFixed(1)}" y="${y-5}" text-anchor="middle">${s.n}</text>`;
      if(i%2===(n-1)%2){const d=new Date(s.d+"T00:00:00");g+=`<text class="lbl" x="${(x+w/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${isT?"اليوم":d.getDate()+"/"+(d.getMonth()+1)}</text>`;}});
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="التسجيل اليومي"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#E4E9E8"/>${g}</svg>`;
  }
  // سؤال متعدد الاختيار (مثل أيام التطوع) يصل كتركيبات «أ, ب, ج» — يُفكّ إلى خيار مستقل لكل قيمة،
  // ونسبة كل خيار من إجمالي المسجلين (لأن الشخص قد يختار أكثر من خيار)
  function explode(g,total){
    const multi=g.items.filter(it=>/,\s/.test(it.k)).length;if(multi<2)return null;
    const m={};g.items.forEach(it=>String(it.k).split(/,\s+/).forEach(k=>{k=k.trim();if(k)m[k]=(m[k]||0)+it.n;}));
    return {label:g.label,note:"يمكن اختيار أكثر من خيار",den:total||1,items:Object.keys(m).map(k=>({k,n:m[k]}))};
  }
  function bkHTML(list,total){
    if(!list||!list.length)return '<p class="empty">لا توجد توزيعات لهذا النموذج</p>';
    return '<div class="bk">'+list.map(g0=>{const g=explode(g0,total)||g0,sum=g.den||g.items.reduce((a,b)=>a+b.n,0)||1;
      return `<div class="bk-group"><b>${g.label}${g.note?` <span style="font-weight:500;color:var(--soft);font-size:11.5px">— ${g.note}</span>`:""}</b>`+g.items.slice().sort((a,b)=>b.n-a.n).slice(0,12).map(it=>{const p=Math.round(it.n*100/sum);
        return `<div class="row"><span class="t">${String(it.k).replace(/</g,"&lt;")}</span><span class="b"><span style="width:${p}%"></span></span><span class="c">${fmt(it.n)} <em>${p}%</em></span></div>`;}).join("")+`</div>`;}).join("")+'</div>';
  }
  function build(){
    $("title").textContent=EV.title;$("sub").textContent=EV.subtitle||"";
    $("jump").innerHTML=EV.trackers.map(t=>`<a href="#trk-${t.key}" style="--c:${COLOR[t.key]}"><b data-j="${t.key}">0</b><span>${t.label}</span></a>`).join("");
    $("boards").innerHTML=EV.trackers.map(t=>`<section class="card trk" id="trk-${t.key}" style="--c:${COLOR[t.key]}">
      <div class="trk-head"><span class="ico">${ICON[t.key]}</span><h2>${t.label}</h2><span class="badge" data-r="badge"></span></div>
      <div class="trk-body">
        <div class="trk-main">
          <div class="big"><div><div class="n" data-r="n">0</div><div class="l">مسجّل حتى الآن</div></div>
            <div class="pct" data-r="pctBox"><b data-r="pct">0%</b><span>من الهدف</span></div></div>
          <div class="bar" data-r="barBox"><span data-r="bar"></span></div>
          <div class="goalmeta" data-r="goal"></div>
          <div class="minis"><div class="mini"><div class="v" data-r="today">0</div><div class="k">سجّلوا اليوم</div></div>
            <div class="mini"><div class="v" data-r="last">—</div><div class="k">آخر تسجيل</div></div>
            <div class="mini"><div class="v" data-r="avg">0</div><div class="k">متوسط يومي</div></div></div>
          <div class="sec-t">التسجيل يوماً بيوم <span data-r="days"></span></div>
          <div class="chart" data-r="chart"></div>
        </div>
        <div class="trk-side"><div class="sec-t">التوزيع <span>نسبة من الإجمالي</span></div><div data-r="bk"></div></div>
      </div></section>`).join("");
  }
  function paint(t,d){
    const box=document.getElementById("trk-"+t.key),q=r=>box.querySelector(`[data-r="${r}"]`),c=COLOR[t.key];
    const badge=q("badge");
    if(d.unlinked||d.error){badge.className="badge wait";badge.textContent=d.unlinked?"لم يُربط بعد":"تعذّر التحديث";
      if(!shown[t.key]){q("chart").innerHTML='<p class="empty">'+(d.unlinked?"سيظهر هنا عند ربط النموذج":"تعذّر جلب البيانات — يُعاد المحاولة تلقائياً")+'</p>';q("bk").innerHTML="";}
      return 0;}
    badge.className="badge"+(d.today?"":" zero");badge.textContent=d.today?("+"+fmt(d.today)+" اليوم"):"لا جديد اليوم";
    animate(q("n"),t.key,d.total);
    const j=document.querySelector(`[data-j="${t.key}"]`);if(j)j.textContent=fmt(d.total);
    if(t.target){const pct=Math.min(100,Math.round(d.total*100/t.target)),left=Math.max(0,t.target-d.total);
      q("pctBox").style.display="";q("barBox").style.display="";q("pct").textContent=pct+"%";q("bar").style.width=pct+"%";
      q("goal").innerHTML=`<span>الهدف <b>${fmt(t.target)}</b></span><span>${left?`متبقٍ <b>${fmt(left)}</b>`:"<b>✔ تحقّق الهدف</b>"}</span>`;}
    else{q("pctBox").style.display="none";q("barBox").style.display="none";q("goal").innerHTML="";}
    q("today").textContent=fmt(d.today);q("last").innerHTML=ago(d.lastAt);
    const days=(d.series||[]).filter(s=>s.n>0).length||1;q("avg").textContent=fmt(Math.round(d.total/days));
    const shownDays=trimSeries(d.series||[]).length;q("days").textContent=shownDays?("آخر "+shownDays+" أيام"):"";
    q("chart").innerHTML=d.series&&d.series.length?chartSVG(d.series,c):'<p class="empty">لا توجد بيانات بعد</p>';
    q("bk").innerHTML=bkHTML(d.breakdowns,d.total);
    return d.total;
  }
  function setLive(st,txt){$("live").className="live"+(st==="ok"?"":" "+st);$("liveTxt").textContent=txt;}
  let tt=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3200);}
  function tick(){
    Promise.all(EV.trackers.map(t=>fetchOne(t).catch(e=>({error:true})))).then(res=>{
      let grand=0,linked=0,ok=0;
      res.forEach((d,i)=>{const t=EV.trackers[i];grand+=paint(t,d)||0;if(!d.unlinked){linked++;if(!d.error)ok++;}
        if(last&&last[i]&&!d.error&&!d.unlinked&&!last[i].error&&!last[i].unlinked&&Math.floor(d.total/50)>Math.floor(last[i].total/50))toast("🎉 "+t.label+": "+fmt(Math.floor(d.total/50)*50));});
      last=res;animate($("grand"),"_grand",grand);
      document.title=fmt(grand)+" مسجّل — "+EV.title;document.body.classList.toggle("closed",!!EV.closed);
      if(!linked)setLive("err","غير مربوط بعد");else if(ok<linked)setLive("err","تعذّر تحديث بعض النماذج");else setLive(EV.closed?"off":"ok",EV.closed?"مغلق":"مباشر");
      $("updated").textContent="آخر تحديث "+new Date().toLocaleTimeString("ar-SA-u-nu-latn",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    });
  }
  build();
  // وضع التجربة يُعلَن بوضوح حتى لا تُقرأ أرقامه الوهمية على أنها حقيقية
  if(P.get("demo")){const b=document.createElement("div");b.className="demo-bar";b.innerHTML='⚠️ هذه <b>بيانات توضيحية</b> وليست الأعداد الحقيقية — <a href="'+location.pathname+'">اعرض الأعداد الحقيقية</a>';document.querySelector(".wrap").prepend(b);}
  tick();
  setInterval(()=>{if(!document.hidden)tick();},EVERY*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});
  const tp=P.get("t");if(tp)setTimeout(()=>{const el=$("trk-"+tp);if(el)el.scrollIntoView({behavior:"smooth"});},600);

  $("screenBtn").onclick=()=>{const on=!document.body.classList.contains("screen");document.body.classList.toggle("screen",on);$("screenBtn").textContent=on?"خروج":"شاشة العرض";
    try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)document.exitFullscreen();}catch(e){}};
  document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("screen")){document.body.classList.remove("screen");$("screenBtn").textContent="شاشة العرض";}});
  $("shareBtn").onclick=()=>{if(!last)return;
    const lines=EV.trackers.map((t,i)=>{const d=last[i]||{};if(d.unlinked||d.error)return `• ${t.label}: —`;return `• ${t.label}: ${fmt(d.total)}`+(t.target?` من ${fmt(t.target)}`:"")+(d.today?` (+${fmt(d.today)} اليوم)`:"");});
    const txt=`📊 ${EV.title}\n${lines.join("\n")}\n\nالعدّاد المباشر: ${location.href}`;
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("تم نسخ الرسالة — الصقها في واتساب"));};
})();
</script>
</body>
</html>
