<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>عدّاد التسجيل | بوابة زارة</title>
<link rel="icon" href="/assets/favicon.png?v=4" sizes="any">
<link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* عدّاد التسجيل المباشر — ثلاثة عدّادات لفعالية واحدة (المشاركون، المتطوعون، المدربون)، كلٌّ من نموذج Google خاص به.
   الصفحة لأصحاب العلاقة: أرقام وتوزيعات فقط، بلا أي بيانات شخصية. */
:root{
  --bg:#F5F6F5; --card:#FFFFFF; --line:#E4E9E8; --ink:#141C1B; --soft:#6B7775;
  --teal:#4B7071; --teal-d:#324C4B; --teal-t:#E6EEED; --tan:#B88D66; --tan-d:#8A6440; --tan-t:#F6EEE5; --ok:#2F6F5E;
  --num:"Readex Pro","IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(60% 40% at 85% 0%,rgba(75,112,113,.10),transparent 70%),radial-gradient(50% 35% at 0% 10%,rgba(184,141,102,.10),transparent 70%)}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header img{height:40px;width:auto;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--teal-d);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.live i{width:9px;height:9px;border-radius:50%;background:#2F9E6E;animation:pulse 2s infinite}
.live.off i{background:#C9A25B;animation:none}
.live.err i{background:#B3453F;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,110,.55)}70%{box-shadow:0 0 0 9px rgba(47,158,110,0)}100%{box-shadow:0 0 0 0 rgba(47,158,110,0)}}
.tools button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--teal-d);border-radius:999px;padding:7px 14px;cursor:pointer}
.tools button:hover{border-color:var(--teal)}
.card{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(20,28,27,.06);border-radius:24px;box-shadow:0 18px 40px -30px rgba(20,28,27,.45)}

/* رأس الفعالية */
.event{padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.event .kicker{display:inline-block;font-size:12.5px;font-weight:700;color:var(--tan-d);background:var(--tan-t);padding:4px 12px;border-radius:999px}
.event h1{margin:8px 0 2px;font-size:clamp(21px,3vw,28px);line-height:1.35}
.event .sub{margin:0;color:var(--soft);font-size:14px}
.event .grand{text-align:center;min-width:150px}
.event .grand .v{font-family:var(--num);font-weight:700;font-size:40px;line-height:1.1;color:var(--teal-d)}
.event .grand .k{font-size:12.5px;color:var(--soft)}
.closed-badge{display:none;margin-top:10px;font-weight:700;color:var(--ok);background:#E4F1EC;border-radius:999px;padding:5px 13px;font-size:13px}
body.closed .closed-badge{display:inline-block}

/* العدّادات الثلاثة — بطاقة لكل نموذج، والمختارة تُفصَّل أسفلها */
.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ctr{padding:18px 20px 16px;text-align:right;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:10px;position:relative;transition:transform .18s,box-shadow .18s,border-color .18s}
.ctr:hover{transform:translateY(-2px)}
.ctr.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent),0 18px 40px -30px rgba(20,28,27,.5)}
.ctr .top{display:flex;align-items:center;gap:10px}
.ctr .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);flex:none}
.ctr .ico svg{width:20px;height:20px}
.ctr .name{font-weight:700;font-size:14.5px;line-height:1.4}
.ctr .n{font-family:var(--num);font-weight:700;font-size:clamp(50px,6.4vw,70px);line-height:1;color:var(--c);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ctr .n.bump{animation:bump .9s ease}
@keyframes bump{0%{transform:scale(1)}25%{transform:scale(1.07)}100%{transform:scale(1)}}
.ctr .bar{height:9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,#fff);overflow:hidden}
.ctr .bar span{display:block;height:100%;width:0;border-radius:999px;background:var(--c);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ctr .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--soft)}
.ctr .meta b{font-family:var(--num);color:var(--ink);font-weight:600}
.ctr .today{position:absolute;inset-inline-end:16px;top:18px;font-size:12px;font-weight:700;color:var(--ok);background:#E4F1EC;border-radius:999px;padding:3px 9px}
.ctr .today.zero{color:var(--soft);background:#F1F3F2}

/* تفاصيل العدّاد المختار */
.details{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.panel{padding:20px 22px}
.panel h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3 span{font-size:12px;font-weight:500;color:var(--soft)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.mini{background:#F7F8F7;border-radius:14px;padding:10px 12px}
.mini .v{font-family:var(--num);font-weight:700;font-size:20px;color:var(--teal-d)}
.mini .v small{font-size:12px;font-weight:600;color:var(--soft);font-family:"IBM Plex Sans Arabic",sans-serif}
.mini .k{font-size:12px;color:var(--soft);margin-top:2px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .lbl{font-size:10px;fill:var(--soft);font-family:var(--num)}
.chart .val{font-size:10.5px;font-weight:700;font-family:var(--num)}
.bk{display:flex;flex-direction:column;gap:18px}
.bk-group b{display:block;font-size:13px;margin-bottom:8px;color:var(--teal-d)}
.row{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) 66px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{height:10px;border-radius:999px;background:#EEF1F0;overflow:hidden}
.row .b span{display:block;height:100%;border-radius:999px;background:var(--c);transition:width 1s ease}
.row:nth-child(odd) .b span{opacity:.7}
.row .c{font-family:var(--num);font-weight:600;color:var(--teal-d);text-align:left;font-size:12.5px}
.row .c em{font-style:normal;color:var(--soft);font-weight:500}
.empty{color:var(--soft);font-size:13px;text-align:center;padding:24px 0}
footer{text-align:center;color:var(--soft);font-size:12px;padding-top:6px}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--teal-d);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* وضع شاشة العرض: الأرقام الثلاثة تملأ الشاشة */
body.screen{padding:0;background:var(--teal-d);color:#fff}
body.screen .wrap{max-width:none;min-height:100vh;justify-content:center;gap:4vh;padding:4vh 4vw}
body.screen header img{filter:brightness(0) invert(1)}
body.screen .live,body.screen .tools button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
body.screen .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);box-shadow:none;backdrop-filter:none}
body.screen .event{justify-content:center;text-align:center}
body.screen .event h1{font-size:3.4vw}
body.screen .event .sub,body.screen .event .grand .k,body.screen .ctr .meta{color:rgba(255,255,255,.75)}
body.screen .event .grand .v,body.screen .ctr .meta b{color:#fff}
body.screen .ctr{cursor:default;border-color:rgba(255,255,255,.12)!important;box-shadow:none!important;text-align:center;align-items:center}
body.screen .ctr .top{flex-direction:column}
body.screen .ctr .name{font-size:2vw}
body.screen .ctr .n{font-size:11vw;color:#fff}
body.screen .ctr .bar{width:100%;background:rgba(255,255,255,.14)}
body.screen .ctr .bar span{background:var(--tan)}
body.screen .ctr .today{display:none}
body.screen .details,body.screen footer{display:none}

@media (max-width:900px){
  .counters{grid-template-columns:1fr}
  .details{grid-template-columns:1fr}
  .event{padding:18px}
  header img{height:34px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/assets/logo.png" alt="خيرية العوامية">
    <div class="tools">
      <span class="live" id="live"><i></i><span id="liveTxt">مباشر</span></span>
      <button type="button" id="shareBtn">مشاركة</button>
      <button type="button" id="screenBtn">شاشة العرض</button>
    </div>
  </header>

  <section class="card event">
    <div>
      <span class="kicker">عدّاد التسجيل المباشر</span>
      <h1 id="title">—</h1>
      <p class="sub" id="sub"></p>
      <span class="closed-badge">✔ اكتمل التسجيل — هذه هي الأعداد النهائية</span>
    </div>
    <div class="grand"><div class="v" id="grand">0</div><div class="k">إجمالي المسجلين في النماذج الثلاثة</div></div>
  </section>

  <section class="counters" id="counters"></section>

  <section class="details">
    <div class="card panel" id="pChart"></div>
    <div class="card panel" id="pBk"></div>
  </section>

  <footer><span id="updated">—</span> · يتحدّث تلقائياً كل 15 ثانية · بوابة زارة</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const P=new URLSearchParams(location.search);
  const EVERY=15;
  const fmt=n=>Number(n||0).toLocaleString("en-US");
  const ICON={
    participants:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.5 14.6c2.6.2 4.6 2 5.2 5.4"/></svg>',
    volunteers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    trainers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 9h6M7 12h4"/></svg>'
  };
  const COLOR={participants:"#4B7071",volunteers:"#B88D66",trainers:"#5B6E8C"};

  /* مصدر البيانات — كل عدّاد من نموذج Google خاص به (سكربت على جدول ردوده)، والشكل المتوقع لكل واحد:
     { total, today, lastAt (ms), target, series:[{d:"2026-10-20",n:12},…], breakdowns:[{label,items:[{k,n}]}] }
     حتى الربط: ?demo=1 يعرض بيانات توضيحية تتغيّر كأن تسجيلات تصل */
  let demo=null;
  function mkSeries(base){const start=new Date();start.setHours(0,0,0,0);return base.map((n,i)=>{const d=new Date(start);d.setDate(d.getDate()-(base.length-1-i));return{d:d.toISOString().slice(0,10),n};});}
  function split(total,ks,ws){let s=0;const it=ks.map((k,i)=>{const n=Math.round(total*ws[i]);s+=n;return{k,n};});it[0].n+=total-s;return it;}
  function demoData(){
    if(!demo){
      const T=[
        {key:"participants",label:"المشاركون في الورشة",target:300,base:[6,9,14,11,18,15,22,19,27,24,31,26,35,12],
          bk:[["الجنس",["ذكر","أنثى"],[.44,.56]],["المؤهل",["بكالوريوس","ثانوي","دبلوم","ماجستير"],[.52,.21,.19,.08]],["المدينة",["العوامية","القطيف","صفوى","سيهات","أخرى"],[.48,.22,.12,.1,.08]]]},
        {key:"volunteers",label:"المتطوعون المشاركون",target:40,base:[0,1,2,1,3,2,2,3,4,2,3,2,4,1],
          bk:[["الجنس",["ذكر","أنثى"],[.5,.5]],["مجال التطوع",["التنظيم والاستقبال","الإعلام والتصوير","الضيافة","الدعم الفني"],[.4,.25,.2,.15]]]},
        {key:"trainers",label:"المدربون",target:12,base:[0,0,1,0,1,0,1,1,0,1,1,0,1,0],
          bk:[["التخصص",["كتابة السيرة الذاتية","المقابلات الوظيفية","المهارات الرقمية","ريادة الأعمال"],[.3,.3,.25,.15]]]}];
      demo={title:"ورشة مفاتيح التوظيف 2",subtitle:"الثلاثاء والأربعاء · 10 – 11 نوفمبر 2026 · قاعة الملك عبدالله",closed:false,
        trackers:T.map(t=>{const series=mkSeries(t.base),total=t.base.reduce((a,b)=>a+b,0);
          return{key:t.key,label:t.label,target:t.target,series,total,lastAt:Date.now()-(5+Math.random()*90)*60000,breakdowns:t.bk.map(([label,ks,ws])=>({label,items:split(total,ks,ws)}))};})};
    }
    demo.trackers.forEach((t,i)=>{if(Math.random()<[.5,.18,.06][i]){t.total++;t.series[t.series.length-1].n++;t.lastAt=Date.now();t.breakdowns.forEach(g=>g.items[Math.floor(Math.random()*g.items.length)].n++);}});
    return Promise.resolve(JSON.parse(JSON.stringify(Object.assign({},demo,{updatedAt:Date.now(),trackers:demo.trackers.map(t=>Object.assign({},t,{today:t.series[t.series.length-1].n}))}))));
  }
  function fetchData(){
    if(P.get("demo")) return demoData();
    // يُربط هنا: رمز الرابط (?k=) يحدد الفعالية وروابط سكربتات نماذجها الثلاثة
    return Promise.reject(new Error("not_linked"));
  }

  let sel=P.get("t")||"participants",last=null;const shown={};
  const ago=ms=>{if(!ms)return"—";const m=Math.max(0,Math.round((Date.now()-ms)/60000));if(m<1)return"الآن";if(m<60)return m+" <small>دقيقة</small>";const h=Math.round(m/60);if(h<24)return h+" <small>ساعة</small>";return Math.round(h/24)+" <small>يوم</small>";};
  function animate(el,key,to){
    const from=shown[key]||0;if(from===to){el.textContent=fmt(to);return;}
    if(to>from&&from>0){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
    const t0=performance.now(),dur=Math.min(1600,400+Math.abs(to-from)*30);
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);shown[key]=to;
  }
  function counters(d){
    const box=$("counters");
    if(box.children.length!==d.trackers.length){
      box.innerHTML=d.trackers.map(t=>`<button type="button" class="card ctr" data-t="${t.key}" style="--c:${COLOR[t.key]||"#4B7071"}">
        <span class="top"><span class="ico">${ICON[t.key]||ICON.participants}</span><span class="name">${t.label}</span></span>
        <span class="today" data-r="today"></span>
        <span class="n" data-r="n">0</span>
        <span class="bar"><span data-r="bar"></span></span>
        <span class="meta"><span data-r="goal"></span><span data-r="pct"></span></span></button>`).join("");
      box.querySelectorAll(".ctr").forEach(b=>b.onclick=()=>{if(document.body.classList.contains("screen"))return;sel=b.dataset.t;renderSel();});
    }
    d.trackers.forEach(t=>{const b=box.querySelector(`[data-t="${t.key}"]`);if(!b)return;
      animate(b.querySelector('[data-r="n"]'),t.key,t.total);
      const td=b.querySelector('[data-r="today"]');td.textContent=t.today?("+"+fmt(t.today)+" اليوم"):"لا جديد اليوم";td.classList.toggle("zero",!t.today);
      const pct=t.target?Math.min(100,Math.round(t.total*100/t.target)):0;
      b.querySelector('[data-r="bar"]').style.width=(t.target?pct:0)+"%";b.querySelector(".bar").style.display=t.target?"":"none";
      b.querySelector('[data-r="goal"]').innerHTML=t.target?`الهدف <b>${fmt(t.target)}</b>`:"";
      b.querySelector('[data-r="pct"]').innerHTML=t.target?(t.total>=t.target?"<b>✔ تحقّق الهدف</b>":`<b>${pct}%</b> · متبقٍ <b>${fmt(t.target-t.total)}</b>`):"";
      b.classList.toggle("on",t.key===sel);});
  }
  function chartSVG(series,color){
    const W=560,H=190,pad=20,n=series.length,max=Math.max(1,...series.map(s=>s.n)),bw=(W-pad*2)/n;let g="";
    series.forEach((s,i)=>{const h=Math.round((H-pad*2-14)*s.n/max),x=pad+i*bw+bw*.18,y=H-pad-h,w=bw*.64,isT=i===n-1;
      g+=`<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${Math.max(2,h)}" rx="${Math.min(6,w/2).toFixed(1)}" fill="${color}" opacity="${isT?1:.55}"/>`;
      if(s.n)g+=`<text class="val" fill="${color}" x="${(x+w/2).toFixed(1)}" y="${y-5}" text-anchor="middle">${s.n}</text>`;
      if(i%2===(n-1)%2){const d=new Date(s.d+"T00:00:00");g+=`<text class="lbl" x="${(x+w/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${isT?"اليوم":d.getDate()+"/"+(d.getMonth()+1)}</text>`;}});
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="التسجيل اليومي"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#E4E9E8"/>${g}</svg>`;
  }
  function renderSel(){
    if(!last)return;const t=last.trackers.find(x=>x.key===sel)||last.trackers[0];sel=t.key;const c=COLOR[t.key]||"#4B7071";
    document.querySelectorAll(".ctr").forEach(b=>b.classList.toggle("on",b.dataset.t===sel));
    const days=(t.series||[]).filter(s=>s.n>0).length||1;
    $("pChart").style.setProperty("--c",c);$("pBk").style.setProperty("--c",c);
    $("pChart").innerHTML=`<h3>${t.label} — التسجيل يوماً بيوم <span>آخر ${(t.series||[]).length} يوماً</span></h3>
      <div class="minis"><div class="mini"><div class="v">${fmt(t.today)}</div><div class="k">سجّلوا اليوم</div></div>
      <div class="mini"><div class="v">${ago(t.lastAt)}</div><div class="k">آخر تسجيل</div></div>
      <div class="mini"><div class="v">${fmt(Math.round(t.total/days))}</div><div class="k">متوسط يومي</div></div></div>
      <div class="chart">${t.series&&t.series.length?chartSVG(t.series,c):'<p class="empty">لا توجد بيانات بعد</p>'}</div>`;
    const bk=t.breakdowns||[];
    $("pBk").innerHTML=`<h3>التوزيع <span>${t.label}</span></h3>`+(bk.length?`<div class="bk">`+bk.map(g=>{const sum=g.items.reduce((a,b)=>a+b.n,0)||1;
      return `<div class="bk-group"><b>${g.label}</b>`+g.items.slice().sort((a,b)=>b.n-a.n).map(it=>{const p=Math.round(it.n*100/sum);
        return `<div class="row"><span class="t">${it.k}</span><span class="b"><span style="width:${p}%"></span></span><span class="c">${fmt(it.n)} <em>${p}%</em></span></div>`;}).join("")+`</div>`;}).join("")+`</div>`:'<p class="empty">لا توجد توزيعات لهذا النموذج</p>');
  }
  function render(d){
    const grand=d.trackers.reduce((a,t)=>a+t.total,0);
    document.title=fmt(grand)+" مسجّل — "+d.title;
    $("title").textContent=d.title;$("sub").textContent=d.subtitle||"";
    document.body.classList.toggle("closed",!!d.closed);
    animate($("grand"),"_grand",grand);
    if(last)d.trackers.forEach(t=>{const p=last.trackers.find(x=>x.key===t.key);if(p&&t.key==="participants"&&Math.floor(t.total/50)>Math.floor(p.total/50))toast("🎉 وصل "+t.label+" إلى "+fmt(Math.floor(t.total/50)*50));});
    last=d;counters(d);renderSel();
    $("updated").textContent="آخر تحديث "+new Date(d.updatedAt||Date.now()).toLocaleTimeString("ar-SA-u-nu-latn",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }
  function setLive(st,txt){$("live").className="live"+(st==="ok"?"":" "+st);$("liveTxt").textContent=txt;}
  let tt=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3200);}
  function tick(){
    fetchData().then(d=>{render(d);setLive(d.closed?"off":"ok",d.closed?"مغلق":"مباشر");})
      .catch(e=>{setLive("err",e&&e.message==="not_linked"?"غير مربوط بعد":"تعذّر التحديث");if(!last)$("title").textContent="لم يُربط هذا العدّاد بالنماذج بعد";});
  }
  tick();setInterval(()=>{if(!document.hidden)tick();},EVERY*1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});

  $("screenBtn").onclick=()=>{const on=!document.body.classList.contains("screen");document.body.classList.toggle("screen",on);$("screenBtn").textContent=on?"خروج":"شاشة العرض";
    try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)document.exitFullscreen();}catch(e){}};
  document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("screen")){document.body.classList.remove("screen");$("screenBtn").textContent="شاشة العرض";}});
  $("shareBtn").onclick=()=>{if(!last)return;
    const lines=last.trackers.map(t=>`• ${t.label}: ${fmt(t.total)}`+(t.target?` من ${fmt(t.target)}`:"")+(t.today?` (+${fmt(t.today)} اليوم)`:""));
    const txt=`📊 ${last.title}\n${lines.join("\n")}\n\nالعدّاد المباشر: ${location.href}`;
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("تم نسخ الرسالة — الصقها في واتساب"));};
})();
</script>
</body>
</html>
