# مزامنة أخبار الوفيات من موقع جمعية العوامية (awamiach.sa) إلى قسم "الوفيات" بلوحة التحكم — يدوياً فقط
# (زر "مزامنة الآن" باللوحة، أو تبويب Actions ← "مزامنة أخبار الوفيات" ← Run workflow). لا جدولة تلقائية
# بطلب المستخدم — كل خبر جديد على الموقع (مهما تأخر النقر) يُسحب كاملاً عند الضغط لأن السحب يفحص كل
# القائمة لا آخر عدد محدود فقط؛ راجع scripts/sync_deaths.py.
name: مزامنة أخبار الوفيات

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "سحب أرشيف الموقع كاملاً (كل الأخبار غير الموجودة بدل الأحدث فقط)"
        type: boolean
        default: false
      dry_run:
        description: "تجربة فقط: يحلّل ويعرض بدون أي كتابة"
        type: boolean
        default: false

concurrency:
  group: sync-deaths
  cancel-in-progress: false

permissions:
  contents: write      # لنشر صفحات التحويل المختصرة s/<code>.html بالمستودع

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: سحب الأخبار الجديدة
        env:
          BACKFILL: ${{ inputs.backfill }}
          DRY_RUN: ${{ inputs.dry_run }}
          FETCH_PROXY_URL: ${{ secrets.FETCH_PROXY_URL }}
          FETCH_PROXY_KEY: ${{ secrets.FETCH_PROXY_KEY }}
        run: |
          ARGS=""
          if [ "$BACKFILL" = "true" ]; then ARGS="--backfill --max-per-run 500"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 scripts/sync_deaths.py $ARGS
      - name: نشر صفحات الروابط المختصرة
        run: |
          if [ -n "$(git status --porcelain s 2>/dev/null)" ]; then
            git config user.name "awamia-sync"
            git config user.email "sync@gzara.org"
            git add s
            git commit -m "روابط مختصرة لأخبار الوفيات (تلقائي)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break || sleep 5; done
          fi
      - name: ربط الروابط المختصرة بالسجلات بعد نشرها
        run: |
          if [ -f short_pending.json ]; then python3 scripts/sync_deaths.py --publish-short short_pending.json; fi
